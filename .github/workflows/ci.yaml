name: CI
# see https://github.com/orgs/community/discussions/57724
permissions: write-all
on:
  workflow_dispatch:
  push:
    branches: [ master, dev, cut-cookie ]
  pull_request:
    branches:
      - '**'
  schedule:
    - cron: '0 0 * * 0'
jobs:

  py-unit:
    name: Pylib Unit Tests
    runs-on: ubuntu-24.04
    env:
      # RE https://stackoverflow.com/a/40184923/17332200
      PIP_NO_CACHE_DIR: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          python -m pip install pip --upgrade
          python -m pip install uv --upgrade
          python -m uv pip install -r requirements.txt --system
      - run: python -m pytest pylib/test/

  binder:
    name: Notebooks
    runs-on: ubuntu-24.04
    env:
      # RE https://stackoverflow.com/a/40184923/17332200
      PIP_NO_CACHE_DIR: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          sudo apt-get update -y
          sudo apt-get install -y ghostscript
          python -m pip install pip --upgrade
          python -m pip install uv --upgrade
          python -m uv pip install -r requirements.txt --system
      # Adapted from https://askubuntu.com/a/524368
      - run: cd binder && ./execute_notebooks.sh
      # adapted from https://unix.stackexchange.com/a/545630
      - run: find -type f -name "*.pdf" -exec bash -c 'gs -sDEVICE=pdfwrite -dCompatibilityLevel=1.4 -dPDFSETTINGS=/screen -dNOPAUSE -dBATCH -dQUIET -sOutputFile="new.pdf" "{}"; rm "{}"; mv "new.pdf" "{}";' {} \;
      - run: rm -rf .gitmodules
      - uses: JamesIves/github-pages-deploy-action@4.0.0
        with:
          folder: .
          branch: binder # The branch the action should deploy to.

  tex:
    name: Latex Build
    runs-on: ubuntu-24.04
    env:
      # RE https://stackoverflow.com/a/40184923/17332200
      PIP_NO_CACHE_DIR: 1
    container:
      image: ghcr.io/mmore500/teximage:sha-77b8179
      # github actions requires root to access mounted volumes
      options: --user root
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Build LaTeX document
        run: |
          trap 'cat paper/*.log || true >> "$GITHUB_OUTPUT"' EXIT
          make -C paper
      - name: Prepare deploy directory
        run: |
          mkdir -p deploy
          cp paper/*-draft.pdf deploy/
          echo "<html><body><a href="$(ls deploy)">Download Manuscript Draft [PDF]</a></body></html>" > deploy/index.html
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: manuscript
          path: paper/*-draft.pdf
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

  tex-deploy:
    name: Latex Deploy
    needs: tex
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    # serialize Pages deploys to avoid concurrent runs timing out
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
